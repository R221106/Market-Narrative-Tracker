<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="sidebar">
        <header>
            <div class="nav-menu">
                <img class="toggle-menu" src="../Images/Nav-Menu.png" alt="Nav-Menu">

            </div>

            <div class="menu-bar">
                <div class="menu">
                    <ul class="menu-links">
                        <li class="nav-link">
                            <a href="index.html">
                                <img class="icons" src="../Images/Home.png" alt="Home-Icon">
                                <span class="text nav-text">Home</span>
                            </a>
                        </li>
                        <li class="nav-link">
                            <a href="search.html">
                                <img class="icons" src="../Images/SearchButton.png" alt="Graph-Icon">
                                <span class="text nav-text">Trending</span>
                            </a>
                        </li>
                        <li class="nav-link">
                            <a href="dashboard.html">
                                <img class="icons" src="../Images/Dashboard.png" alt="Dashboard-Icon">
                                <span class="text nav-text">Dashboard</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>
    </nav>
    <section class="dashboard-main">
        <video autoplay loop muted playsinline class="backgroundVideo">
            <source src="../Videos/Background.mp4" type="video/mp4">
        </video>
        <div class="overlayer"></div>
        <div class="dashboard-content"> 
            <h1>SENTIPULSE</h1> 
            <div class="search-input">
                <input id="search-input" type="text" autocomplete="off" placeholder="Search whats in the Market....">                    
                <button id="search-button" type="submit">
                    <img src="../Images/SearchButton.png" alt="seachButtonImg">
                </button>
            </div>
        </div>
    </section>
    <div class="dashboard">
        <div class="headlines">
            <h2>RECENT HEADLINES</h2> <br>
            <div id="news-container">
                <div class="loading">
                    <p>Loading </p>
                    <div class="container">
                        <div class="dot dot1"></div>
                        <div class="dot dot2"></div>
                        <div class="dot dot3"></div>
                    </div>
                </div>
            </div>
            <div id="sentimental-badge">
            </div>
        </div>
        <div class="top-market">
            <h2>POPULAR</h2> 
            <p id="top-searches">Loading popular trends ...</p>
        </div>
        <div class="top-sources">
            <h2>TOP SOURCES</h2> <br>
            <div id="top-sources-container"></div>
        </div>
        <div class="ai-summary">
            <h2>AI SUMMARY</h2> <br>
            <div id="summary-content">
                <div id="summary-loading">
                    <p>Generating Market Summary</p>
                    <div class="loader">
                        <div class="loader__bar"></div>
                        <div class="loader__bar"></div>
                        <div class="loader__bar"></div>
                        <div class="loader__bar"></div>
                        <div class="loader__bar"></div>
                        <div class="loader__ball"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="Trending-analysis">
            <h2>TRENDING ANALYSIS</h2> <br>
            <p id="trend-info"></p>
            <canvas id="trend-chart"></canvas>
        </div>
        <div class="market-chart-1">
            <h2>MARKET ANALYSIS</h2>
            <p><i>Current Market</i></p>
            <canvas id="chart-1"></canvas>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
